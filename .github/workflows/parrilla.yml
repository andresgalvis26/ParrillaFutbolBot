name: Parrilla Futbol -> Telegram

on:
  # 8:00 AM Colombia (UTC-5). GitHub usa UTC.
  schedule:
    - cron: "0 13 * * *"

  # Permite ejecutarlo a mano desde la pestaña Actions.
  workflow_dispatch:
    inputs:
      tipo:
        description: "Qué enviar"
        required: true
        default: "hoy"
        type: choice
        options:
          - hoy
          - manana
          - semana
          - todo
      source:
        description: "Fuente de datos"
        required: true
        default: "futbolred"
        type: choice
        options:
          - futbolred
          - partidos-de-hoy
          - futbolenvivo

permissions:
  contents: read

# Evita que dos ejecuciones se pisen si una tarda más de lo normal.
concurrency:
  group: parrilla-futbol
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        # El script importa `config.emoji_ligas` y escribe en logs/,
        # así que debe ejecutarse desde src/.
        working-directory: src

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/config/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt

      - name: Enviar partidos a Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        run: |
          python bot_parrilla.py "${{ inputs.tipo || 'hoy' }}" --source "${{ inputs.source || 'futbolred' }}"
